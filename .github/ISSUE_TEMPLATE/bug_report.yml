name: Bug 报告
description: 报告一个可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **安全漏洞不要发在这里**，请发 security@nvwalab.com。
        公开 issue 里请去掉密钥、内网地址、个人信息。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 一句话说清现象
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望 / 实际
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 运行环境与版本 / 提交号
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选，务必脱敏）
      description: 去掉密钥、内网地址、个人信息
    validations:
      required: false

